<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Warm Horizon Care provides respectful, person-centred NDIS disability support in Perth, Western Australia."
  />
  <title>Warm Horizon Care | NDIS Support in Perth</title>

  <style>
    :root {
      --cream: #fbf7f1;
      --cream-deep: #f2e8dc;
      --white: #ffffff;
      --ink: #29312d;
      --muted: #637068;
      --terracotta: #a75138;
      --terracotta-dark: #813a29;
      --sage: #607563;
      --sage-dark: #405846;
      --border: #e6d9ca;
      --gold: #e5b06d;
      --radius: 18px;
      --shadow: 0 14px 42px rgba(67, 45, 29, 0.10);
      --max-width: 1160px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .container {
      width: min(92%, var(--max-width));
      margin: 0 auto;
    }

    .section {
      padding: 88px 0;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--terracotta);
      font-size: 0.77rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1,
    h2,
    h3 {
      line-height: 1.15;
    }

    h1 {
      max-width: 840px;
      margin-bottom: 22px;
      font-size: clamp(2.65rem, 6vw, 5.25rem);
      letter-spacing: -0.06em;
    }

    h2 {
      margin-bottom: 16px;
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: -0.045em;
    }

    h3 {
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .lead {
      max-width: 690px;
      color: var(--muted);
      font-size: 1.12rem;
    }

    .section-intro {
      max-width: 720px;
      margin-bottom: 42px;
    }

    /* Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(230, 217, 202, 0.9);
      background: rgba(251, 247, 241, 0.94);
      backdrop-filter: blur(12px);
    }

    .nav {
      display: flex;
      min-height: 78px;
      align-items: center;
      justify-content: space-between;
      gap: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--terracotta);
      font-size: 1.15rem;
    }

    .brand-name {
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .brand-name small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.61rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 24px;
      margin: 0;
      padding: 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      list-style: none;
    }

    .nav-links a:hover,
    .nav-links a:focus {
      color: var(--terracotta);
    }

    .menu-button {
      display: none;
      border: 0;
      padding: 8px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 1.6rem;
    }

    /* Buttons */
    .button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border: 1px solid transparent;
      border-radius: 999px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, border 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button-primary {
      color: white;
      background: var(--terracotta);
    }

    .button-primary:hover {
      background: var(--terracotta-dark);
    }

    .button-outline {
      border-color: var(--border);
      background: var(--white);
      color: var(--ink);
    }

    .button-outline:hover {
      border-color: var(--terracotta);
      color: var(--terracotta);
    }

    /* Hero */
    .hero {
      overflow: hidden;
      padding: 96px 0 82px;
      background:
        radial-gradient(circle at 95% 12%, rgba(167, 81, 56, 0.17), transparent 24rem),
        radial-gradient(circle at 6% 92%, rgba(96, 117, 99, 0.14), transparent 22rem),
        var(--cream);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 54px;
      align-items: end;
    }
